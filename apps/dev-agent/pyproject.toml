[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "testagent-dev-agent"
version = "0.1.0"
description = "Simple Agent and web UI used to integrate-test TestAgent capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "httpx2>=2.5,<3",
    "mcp==2.0.0",
    "openai>=1.0,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "rpa-agent-module>=0.1,<0.2",
    "testagent-sandbox-gateway>=0.1,<0.2",
    "uvicorn>=0.30,<1",
]

[tool.uv.sources]
rpa-agent-module = { workspace = true }

[project.scripts]
testagent = "testagent_dev_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
web_agent = ["static/*", "static/generation-ui/*", "THIRD_PARTY_NOTICES.txt"]
