openapi: 3.1.0
info:
  title: TestAgent Web Capability
  version: 0.1.0
  description: Read-only search and static public web fetch API for Agent runtimes.
servers:
  - url: http://127.0.0.1:3020
paths:
  /health:
    get:
      operationId: webCapabilityHealth
      responses:
        "200":
          description: Service state without a billable provider request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/search:
    post:
      operationId: webSearch
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
        - {$ref: "#/components/parameters/AgentId"}
        - {$ref: "#/components/parameters/TenantId"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Normalized untrusted search candidates.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
        "504": {$ref: "#/components/responses/Error"}
  /v1/fetch:
    post:
      operationId: webFetch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url: {type: string, format: uri, maxLength: 8192}
      responses:
        "200":
          description: Extracted static page with security and provenance metadata.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FetchResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
components:
  parameters:
    RequestId:
      in: header
      name: X-Request-ID
      required: false
      schema: {type: string, maxLength: 128}
    AgentId:
      in: header
      name: X-Agent-ID
      required: false
      schema: {type: string, maxLength: 128}
    TenantId:
      in: header
      name: X-Tenant-ID
      required: false
      schema: {type: string, maxLength: 128}
  responses:
    Error:
      description: Structured capability error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    ErrorResponse:
      type: object
      required: [success, error_type, message, retryable]
      properties:
        success: {type: boolean, const: false}
        error_type: {type: string}
        message: {type: string}
        retryable: {type: boolean}
        retry_after_seconds: {type: [integer, "null"]}
    HealthResponse:
      type: object
      required: [status, search_configured, benchmark_dns_proxy_enabled]
      properties:
        status: {type: string, const: ok}
        search_configured: {type: boolean}
        benchmark_dns_proxy_enabled: {type: boolean}
    SearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 400}
        max_results: {type: integer, minimum: 1, maximum: 20, default: 5}
    SearchResult:
      type: object
      required: [provider, rank, title, url, extra_snippets, domain]
      properties:
        provider: {type: string}
        rank: {type: integer, minimum: 1}
        title: {type: string}
        url: {type: string, format: uri}
        snippet: {type: [string, "null"]}
        extra_snippets:
          type: array
          items: {type: string}
        published_at: {type: [string, "null"]}
        domain: {type: string}
        provider_score: {type: [number, "null"]}
        rerank_score: {type: [number, "null"]}
    SearchResponse:
      type: object
      required: [success, query, provider, result_count, request_id, cache_hit, attempts, elapsed_ms, results, trust, instructions_executable]
      properties:
        success: {type: boolean, const: true}
        query: {type: string}
        provider: {type: string}
        result_count: {type: integer}
        request_id: {type: string}
        cache_hit: {type: boolean}
        attempts: {type: integer}
        elapsed_ms: {type: integer}
        results:
          type: array
          items: {$ref: "#/components/schemas/SearchResult"}
        trust: {type: string, const: untrusted}
        instructions_executable: {type: boolean, const: false}
    FetchResponse:
      type: object
      required: [success, requested_url, final_url, status_code, content_type, text, fetch_method, retrieved_at, body_hash, content_hash, text_truncated, extraction_quality, redirects, robots_checked, robots_urls, robots_cache_hits, resolved_addresses, dns_rebinding_protection, trust, instructions_executable]
      properties:
        success: {type: boolean, const: true}
        requested_url: {type: string, format: uri}
        final_url: {type: string, format: uri}
        status_code: {type: integer}
        content_type: {type: string}
        title: {type: [string, "null"]}
        text: {type: string}
        author: {type: [string, "null"]}
        published_at: {type: [string, "null"]}
        modified_at: {type: [string, "null"]}
        fetch_method: {type: string}
        retrieved_at: {type: string, format: date-time}
        body_hash: {type: string}
        content_hash: {type: string}
        text_truncated: {type: boolean}
        extraction_quality: {type: number}
        redirects: {type: array, items: {type: string, format: uri}}
        robots_checked: {type: boolean}
        robots_urls: {type: array, items: {type: string, format: uri}}
        robots_cache_hits: {type: integer}
        resolved_addresses: {type: array, items: {type: string}}
        dns_rebinding_protection: {type: string}
        trust: {type: string, const: untrusted}
        instructions_executable: {type: boolean, const: false}
