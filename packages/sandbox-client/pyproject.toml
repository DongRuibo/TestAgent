[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "testagent-sandbox-client"
version = "0.1.0"
description = "Synchronous and asynchronous Python SDK for TestAgent Sandbox Gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "testagent-sandbox-contracts>=0.1,<0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
