[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "testagent-sandbox-contracts"
version = "0.1.0"
description = "Versioned request and response contracts for TestAgent Sandbox Gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[tool.setuptools.packages.find]
where = ["src"]
