[project]
name = "testagent-workspace"
version = "0.1.0"
description = "A from-scratch learning project for understanding agent internals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "e2b-code-interpreter>=2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=1.0,<3",
    "playwright>=1.50,<2",
    "ppio-sandbox>=1.0.5,<2",
    "python-dotenv>=1.0,<2",
    "reportlab>=4.2,<5",
    "testagent-sandbox-client>=0.1,<0.2",
    "testagent-sandbox-contracts>=0.1,<0.2",
    "testagent-sandbox-gateway>=0.1,<0.2",
    "testagent-dev-agent>=0.1,<0.2",
    "testagent-web-tools>=0.1,<0.2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "apps/dev-agent/src",
    "services/sandbox-gateway/src",
    "packages/sandbox-contracts/src",
    "packages/sandbox-client/src",
    "packages/web-capability-tools/src",
]

[tool.uv.workspace]
members = [
    "apps/dev-agent",
    "services/sandbox-gateway",
    "packages/sandbox-contracts",
    "packages/sandbox-client",
    "packages/rpa-agent-module",
    "packages/web-capability-tools",
]

[tool.uv.sources]
testagent-dev-agent = { workspace = true }
testagent-sandbox-client = { workspace = true }
testagent-sandbox-contracts = { workspace = true }
testagent-sandbox-gateway = { workspace = true }
testagent-web-tools = { workspace = true }
