[project]
name = "mini-agent"
version = "0.1.0"
description = "A from-scratch learning project for understanding agent internals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "e2b-code-interpreter>=2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=1.0,<3",
    "playwright>=1.50,<2",
    "ppio-sandbox>=1.0.5,<2",
    "python-dotenv>=1.0,<2",
    "reportlab>=4.2,<5",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
