[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "testagent-sandbox-gateway"
version = "0.1.0"
description = "Provider-neutral Sandbox Gateway for Agent workloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "e2b-code-interpreter>=2,<3",
    "fastapi>=0.115,<1",
    "playwright>=1.50,<2",
    "ppio-sandbox>=1.0.5,<2",
    "python-dotenv>=1.0,<2",
    "reportlab>=4.2,<5",
    "testagent-sandbox-contracts>=0.1,<0.2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
testagent-sandbox-gateway = "sandbox_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sandbox_runtime = ["render_briefing.mjs"]
