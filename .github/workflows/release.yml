name: Capability release

on:
  push:
    tags:
      - "sandbox-v*"
      - "web-capability-v*"

permissions:
  contents: write
  packages: write

jobs:
  sandbox:
    if: startsWith(github.ref_name, 'sandbox-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run pytest tests/test_gateway.py tests/test_gateway_sandbox_tools.py
      - run: uv build --package testagent-sandbox-contracts --out-dir dist
      - run: uv build --package testagent-sandbox-client --out-dir dist
      - run: uv build --package testagent-sandbox-gateway --out-dir dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/sandbox-gateway/Dockerfile
          push: true
          tags: ghcr.io/dongruibo/testagent-sandbox-gateway:${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  web-capability:
    if: startsWith(github.ref_name, 'web-capability-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path services/web-capability/Cargo.toml --all-targets --locked
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv build --package testagent-web-tools --out-dir dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/web-capability
          file: services/web-capability/Dockerfile
          push: true
          tags: ghcr.io/dongruibo/testagent-web-capability:${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
