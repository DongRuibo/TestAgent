name: Web Capability CI

on:
  pull_request:
    paths:
      - "services/web-capability/**"
      - "contracts/web-capability-openapi.yaml"
      - ".github/workflows/web-capability-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/web-capability/**"
      - "contracts/web-capability-openapi.yaml"
      - ".github/workflows/web-capability-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-capability
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/web-capability
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --locked
